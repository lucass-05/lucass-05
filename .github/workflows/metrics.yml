# Genera cada noche la tarjeta de estadísticas (github-metrics.svg) y la
# guarda en el propio repositorio: así el README siempre carga la imagen
# sin depender de servicios externos saturados.
name: Estadísticas del perfil

on:
  schedule:
    - cron: "0 5 * * *"   # todas las noches a las 5:00 UTC
  workflow_dispatch:       # y a mano desde la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generar tarjeta de métricas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: lucass-05
          template: classic
          base: header, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          config_timezone: Europe/Madrid
          filename: github-metrics.svg
